<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 300" width="1280" height="300" role="img" aria-labelledby="title desc">
<title id="title">Perbedaan alur data RigForge dan Relay</title><desc id="desc">Data avatar RigForge diproses lokal di browser. Relay menyimpan konfigurasi dalam localStorage dan meneruskan permintaan melalui Next.js API Route ke Discord.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#171D36"/></linearGradient></defs>
<rect width="1280" height="300" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="298" rx="21" fill="none" stroke="#394567"/>
<text x="32" y="38" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#9DAAF7">DATA PATHS / TWO WORKSPACES</text>
<g font-family="Inter,Arial,sans-serif">
  <text x="32" y="77" font-size="17" font-weight="800" fill="#E8EDFF">RIGFORGE</text>
  <g transform="translate(32 92)"><rect width="235" height="92" rx="12" fill="#151F36" stroke="#5B66A1"/><text x="18" y="28" font-size="14" font-weight="700" fill="#F4F6FF">Data avatar</text><text x="18" y="52" font-size="12" fill="#B8C4E2">Input ditempel pengguna</text><text x="18" y="72" font-size="12" fill="#B8C4E2">di browser</text></g>
  <path d="M273 138H320M309 129L320 138L309 147" fill="none" stroke="#8C99F8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(328 92)"><rect width="235" height="92" rx="12" fill="#192C32" stroke="#2DD4BF"/><text x="18" y="28" font-size="14" font-weight="700" fill="#E6FFFB">Browser parser</text><text x="18" y="52" font-size="12" fill="#A7F3D0">Konversi lokal</text><text x="18" y="72" font-size="12" fill="#A7F3D0">tanpa upload input</text></g>
  <path d="M568 138H615M604 129L615 138L604 147" fill="none" stroke="#8C99F8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(623 92)"><rect width="235" height="92" rx="12" fill="#211C42" stroke="#8979F8"/><text x="18" y="28" font-size="14" font-weight="700" fill="#EDE9FE">Hasil Lua</text><text x="18" y="52" font-size="12" fill="#C4B5FD">Disalin pengguna</text><text x="18" y="72" font-size="12" fill="#C4B5FD">ke Roblox Studio</text></g>
  <rect x="32" y="202" width="826" height="49" rx="10" fill="#131B31" stroke="#384567"/><circle cx="54" cy="226" r="6" fill="#86EFAC"/><text x="72" y="231" font-size="13" font-weight="700" fill="#D9E2F8">Konversi avatar: browser → browser. Input tidak melewati server RigForge.</text>
  <path d="M880 60V266" stroke="#394567" stroke-width="2" stroke-dasharray="5 7"/>
  <text x="908" y="77" font-size="17" font-weight="800" fill="#E8EDFF">RELAY / DISCORD</text>
  <g transform="translate(908 92)"><rect width="106" height="92" rx="11" fill="#151F36" stroke="#5B66A1"/><text x="53" y="31" font-size="13" font-weight="700" fill="#F4F6FF" text-anchor="middle">Browser</text><text x="53" y="53" font-size="11" fill="#B8C4E2" text-anchor="middle">localStorage</text><text x="53" y="72" font-size="11" fill="#B8C4E2" text-anchor="middle">Bot config</text></g>
  <path d="M1018 138H1040M1032 131L1040 138L1032 145" fill="none" stroke="#8C99F8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(1046 92)"><rect width="98" height="92" rx="11" fill="#211C42" stroke="#8979F8"/><text x="49" y="29" font-size="12" font-weight="700" fill="#EDE9FE" text-anchor="middle">Next.js</text><text x="49" y="47" font-size="11" fill="#C4B5FD" text-anchor="middle">API Route</text><text x="49" y="67" font-size="10" fill="#C4B5FD" text-anchor="middle">Forward</text></g>
  <path d="M1148 138H1165M1157 131L1165 138L1157 145" fill="none" stroke="#8C99F8" stroke-width="3" stroke-linecap="round"/>
  <g transform="translate(1171 92)"><rect width="79" height="92" rx="11" fill="#132A3C" stroke="#22D3EE"/><text x="39.5" y="34" font-size="12" font-weight="700" fill="#E6FCFF" text-anchor="middle">Discord</text><text x="39.5" y="54" font-size="10" fill="#A5F3FC" text-anchor="middle">API</text></g>
  <text x="908" y="213" font-size="12" fill="#B8C4E2">Token stays in localStorage;</text><text x="908" y="232" font-size="12" fill="#B8C4E2">requests use the server route.</text><text x="908" y="251" font-size="12" fill="#B8C4E2">No database or app logs.</text>
</g></svg>