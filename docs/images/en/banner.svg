<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 380" width="1280" height="380" role="img" aria-labelledby="title desc">
<title id="title">RigForge — Roblox avatar to Lua converter</title>
<desc id="desc">Raw avatar data is converted in the browser into a Lua script structure.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#151A32"/></linearGradient>
  <linearGradient id="violet" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#A78BFA"/><stop offset="1" stop-color="#6255F5"/></linearGradient>
  <linearGradient id="cyan" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#67E8F9"/><stop offset="1" stop-color="#60A5FA"/></linearGradient>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#9BA8D8" stroke-opacity=".075"/></pattern>
  <filter id="glow"><feGaussianBlur stdDeviation="24"/></filter>
</defs>
<rect width="1280" height="380" rx="24" fill="url(#bg)"/>
<rect width="1280" height="380" rx="24" fill="url(#grid)"/>
<ellipse cx="1040" cy="135" rx="200" ry="130" fill="#635BFF" opacity=".24" filter="url(#glow)"/>
<ellipse cx="860" cy="300" rx="170" ry="90" fill="#22D3EE" opacity=".12" filter="url(#glow)"/>
<rect x="1" y="1" width="1278" height="378" rx="23" fill="none" stroke="#6471A6" stroke-opacity=".4" stroke-width="2"/>
<g transform="translate(64 54)">
  <rect x="0" y="0" width="44" height="44" rx="13" fill="url(#violet)"/>
  <path d="M10 13H32L21 22H33L16 34L21 25H9L20 17H10Z" fill="#F7F8FF"/>
  <text x="62" y="30" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" fill="#F7F8FF">RigForge</text>
  <rect x="228" y="3" width="182" height="30" rx="15" fill="#161E39" stroke="#6F75EF" stroke-opacity=".8"/>
  <text x="319" y="23" font-family="Arial,sans-serif" font-size="12" font-weight="700" letter-spacing="1.3" text-anchor="middle" fill="#C7D2FE">AVATAR → LUA</text>
</g>
<text x="66" y="145" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" fill="#F7F8FF">From avatar data</text>
<text x="66" y="193" font-family="Inter,Arial,sans-serif" font-size="42" font-weight="850" fill="#A5B4FC">to Lua script.</text>
<text x="68" y="233" font-family="Inter,Arial,sans-serif" font-size="17" fill="#B9C3DF">Paste data. Review the output. Copy to Roblox Studio.</text>
<g transform="translate(68 270)">
  <rect width="175" height="42" rx="12" fill="url(#violet)"/>
  <text x="87.5" y="26" font-family="Inter,Arial,sans-serif" font-size="14" font-weight="750" fill="#FFFFFF" text-anchor="middle">Browser-based</text>
  <rect x="188" width="170" height="42" rx="12" fill="#141B31" stroke="#38476A"/>
  <circle cx="208" cy="21" r="5" fill="#86EFAC"/>
  <text x="222" y="26" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="650" fill="#D9E2F8">Local input</text>
</g>
<g transform="translate(670 60)">
  <rect x="0" y="0" width="232" height="245" rx="16" fill="#121A30" stroke="#52618C" stroke-width="1.5"/>
  <path d="M0 45H232" stroke="#52618C" stroke-opacity=".65"/>
  <circle cx="20" cy="22" r="4" fill="#FB7185"/><circle cx="35" cy="22" r="4" fill="#FBBF24"/><circle cx="50" cy="22" r="4" fill="#86EFAC"/>
  <text x="18" y="70" font-family="monospace" font-size="13" fill="#A5B4FC">RAW DATA</text>
  <text x="18" y="99" font-family="monospace" font-size="14" fill="#E6ECFF">Head: 12345</text>
  <text x="18" y="126" font-family="monospace" font-size="14" fill="#E6ECFF">Torso: 23456</text>
  <text x="18" y="153" font-family="monospace" font-size="14" fill="#E6ECFF">HairAccessory:</text>
  <text x="18" y="176" font-family="monospace" font-size="14" fill="#E6ECFF">98765, 87654</text>
  <rect x="18" y="199" width="196" height="28" rx="7" fill="#1F2948"/>
  <text x="116" y="217" font-family="monospace" font-size="11" fill="#86EFAC" text-anchor="middle">Processed in browser</text>
</g>
<path d="M918 180H967M954 167L967 180L954 193" fill="none" stroke="#8B9CFF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
<g transform="translate(984 78)">
  <rect width="232" height="217" rx="16" fill="#0B1225" stroke="#746CF5" stroke-width="1.5"/>
  <path d="M0 45H232" stroke="#5147B8" stroke-opacity=".8"/>
  <rect x="16" y="15" width="22" height="16" rx="4" fill="#7C6EF5"/>
  <text x="47" y="27" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700" fill="#DEE2FF">LUA OUTPUT</text>
  <text x="16" y="72" font-family="monospace" font-size="13" fill="#C4B5FD">Body = {</text>
  <text x="30" y="96" font-family="monospace" font-size="12" fill="#67E8F9">Head = 12345,</text>
  <text x="30" y="120" font-family="monospace" font-size="12" fill="#67E8F9">Torso = 23456,</text>
  <text x="30" y="144" font-family="monospace" font-size="12" fill="#86EFAC">... generated</text>
  <text x="16" y="168" font-family="monospace" font-size="13" fill="#C4B5FD">}</text>
  <rect x="16" y="184" width="200" height="22" rx="6" fill="#352F72"/>
  <text x="116" y="199" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#FFFFFF" text-anchor="middle">COPY → STUDIO</text>
</g>
</svg>