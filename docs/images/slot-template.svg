    <rect x="24" y="133" width="542" height="35" rx="8" fill="#192C32" stroke="#2DD4BF"/><text x="40" y="155" fill="#E6FFFB">{ AssetId = 102, AccessoryType = "Hat" },</text><text x="545" y="155" fill="#5EEAD4" text-anchor="end">02</text>
    <rect x="24" y="175" width="542" height="35" rx="8" fill="#192C32" stroke="#2DD4BF"/><text x="40" y="197" fill="#E6FFFB">{ AssetId = 103, AccessoryType = "Hat" },</text><text x="545" y="197" fill="#5EEAD4" text-anchor="end">03</text>
    <rect x="24" y="217" width="542" height="35" rx="8" fill="#2B244D" stroke="#A78BFA" stroke-dasharray="6 4"/><text x="40" y="239" fill="#E9D5FF">{ AssetId = 104, AccessoryType = "Hat" },</text><text x="545" y="239" fill="#C4B5FD" text-anchor="end">+1</text>
  </g>
  <text x="24" y="278" font-size="13" font-weight="700" fill="#C4B5FD">ID ke-4 membuat baris tambahan.</text>
</g>
