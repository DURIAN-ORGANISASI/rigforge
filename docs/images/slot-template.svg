<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 390" width="1280" height="390" role="img" aria-labelledby="title desc">
<title id="title">Contoh template slot RigForge</title><desc id="desc">Hat memiliki tiga slot minimum lalu satu baris tambahan untuk ID keempat. Face memiliki tujuh slot, dua ID terisi dan lima slot nol.</desc>
<defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#0B1020"/><stop offset="1" stop-color="#171D36"/></linearGradient></defs>
<rect width="1280" height="390" rx="22" fill="url(#bg)"/><rect x="1" y="1" width="1278" height="388" rx="21" fill="none" stroke="#394567"/>
<text x="34" y="39" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="800" letter-spacing="2" fill="#9DAAF7">UNIVERSAL TEMPLATE / CONTOH</text>
<g transform="translate(30 58)" font-family="Inter,Arial,sans-serif">
  <rect width="590" height="296" rx="16" fill="#131B31" stroke="#5B66A1"/>
  <rect x="0" y="0" width="590" height="49" rx="16" fill="#20294A"/><rect x="0" y="32" width="590" height="17" fill="#20294A"/>
  <text x="24" y="31" font-size="19" font-weight="800" fill="#EAEFFF">Hat</text><text x="559" y="30" font-size="13" font-weight="700" fill="#A5B4FC" text-anchor="end">MIN. 3 SLOTS</text>
  <text x="24" y="75" font-size="13" fill="#B8C4E2">Input IDs: 101, 102, 103, 104</text>
