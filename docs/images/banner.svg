<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 340" width="1280" height="340" role="img" aria-labelledby="title desc">
<title id="title">RigForge — konverter avatar Roblox ke Lua</title>
<desc id="desc">Antarmuka RigForge dengan panel data avatar dan hasil Lua di dalam workspace gelap beraksen biru dan sian.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset="1" stop-color="#111D31"/></linearGradient>
  <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4C8DFF"/><stop offset="1" stop-color="#4AD7E9"/></linearGradient>
  <linearGradient id="panelGlow" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#15243A"/><stop offset="1" stop-color="#0D1524"/></linearGradient>
  <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8EABD6" fill-opacity=".13"/></pattern>
  <radialGradient id="glowBlue"><stop stop-color="#2F70D9" stop-opacity=".25"/><stop offset="1" stop-color="#2F70D9" stop-opacity="0"/></radialGradient>
  <radialGradient id="glowCyan"><stop stop-color="#23BBD0" stop-opacity=".18"/><stop offset="1" stop-color="#23BBD0" stop-opacity="0"/></radialGradient>
</defs>
<rect width="1280" height="340" rx="24" fill="url(#bg)"/>
<rect width="1280" height="340" rx="24" fill="url(#dots)"/>
<ellipse cx="1000" cy="95" rx="340" ry="240" fill="url(#glowBlue)"/>
<ellipse cx="1200" cy="310" rx="270" ry="170" fill="url(#glowCyan)"/>
<rect x="1" y="1" width="1278" height="338" rx="23" fill="none" stroke="#31445F" stroke-opacity=".8"/>
<g transform="translate(54 43)">
  <rect width="42" height="42" rx="13" fill="url(#accent)"/>
  <path d="M24 10 14 21 24 32M18 10 28 21 18 32" fill="none" stroke="#071321" stroke-width="2.8" stroke-linecap="round" stroke-linejoin="round" transform="translate(0 0)"/>
  <text x="56" y="27" font-family="Inter,Arial,sans-serif" font-size="27" font-weight="800" letter-spacing="-1.2" fill="#F0F6FF">RigForge</text>
  <rect x="214" y="5" width="156" height="27" rx="13.5" fill="#14243A" stroke="#355779"/>
  <text x="292" y="22" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1.25" fill="#92DFF0">AVATAR DATA → LUA</text>
</g>
<text x="56" y="139" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800" letter-spacing="-1.6" fill="#F0F6FF">Konversi avatar,</text>
<text x="56" y="183" font-family="Inter,Arial,sans-serif" font-size="37" font-weight="800" letter-spacing="-1.6" fill="url(#accent)">tanpa alur yang rumit.</text>
<text x="58" y="218" font-family="Inter,Arial,sans-serif" font-size="15" fill="#A9BAD3">Tempel data, periksa Lua, lalu salin ke Roblox Studio.</text>
<g transform="translate(56 244)">
  <rect width="150" height="34" rx="10" fill="#14263A" stroke="#2A566C"/>
  <circle cx="16" cy="17" r="4" fill="#4AD7E9"/>
  <text x="28" y="21" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#D8F7FA">Diproses lokal</text>
  <rect x="160" width="138" height="34" rx="10" fill="#14263A" stroke="#2A405F"/>
  <path d="M174 12h9m-4.5 -4.5 4.5 4.5-4.5 4.5" fill="none" stroke="#78AFFF" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="190" y="21" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="700" fill="#D8E5FA">Output terstruktur</text>
</g>
<g transform="translate(625 36)">
  <rect width="600" height="270" rx="18" fill="url(#panelGlow)" stroke="#304965" stroke-width="1.2"/>
  <path d="M0 50H600" stroke="#2B4059"/>
  <circle cx="22" cy="25" r="4" fill="#4C8DFF"/><circle cx="37" cy="25" r="4" fill="#4AD7E9"/><circle cx="52" cy="25" r="4" fill="#69819F"/>
  <text x="72" y="29" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" letter-spacing=".8" fill="#D6E4F7">RIGFORGE / WORKSPACE</text>
  <rect x="486" y="14" width="96" height="23" rx="11.5" fill="#12372F" stroke="#236B59"/>
  <circle cx="500" cy="25.5" r="3" fill="#4AD7B1"/>
  <text x="510" y="29" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" letter-spacing=".6" fill="#A9F5DC">LOCAL</text>
  <g transform="translate(17 68)">
    <rect width="250" height="170" rx="12" fill="#111E31" stroke="#344C6A"/>
    <path d="M0 3Q0 0 12 0H238Q250 0 250 12V38H0Z" fill="#192B43"/>
    <path d="M0 38H250" stroke="#344C6A"/>
    <rect x="13" y="12" width="22" height="22" rx="6" fill="#203F69"/>
    <path d="M19 18h10v8H19zM21 20h6M21 23h4" fill="none" stroke="#8AB5FF" stroke-width="1.3" stroke-linecap="round"/>
    <text x="45" y="21" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing=".8" fill="#8FA8C8">INPUT / DATA MENTAH</text>
    <text x="45" y="31" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F0F6FF">Data avatar</text>
    <g font-family="monospace" font-size="10">
      <text x="14" y="61" fill="#8FA8C8">Head</text><text x="230" y="61" text-anchor="end" fill="#E0ECFC">7825…2204</text>
      <text x="14" y="82" fill="#8FA8C8">Torso</text><text x="230" y="82" text-anchor="end" fill="#E0ECFC">1142…7907</text>
      <text x="14" y="103" fill="#8FA8C8">TShirt</text><text x="230" y="103" text-anchor="end" fill="#E0ECFC">7444…0125</text>
      <text x="14" y="124" fill="#8FA8C8">Pants</text><text x="230" y="124" text-anchor="end" fill="#E0ECFC">1239…3652</text>
    </g>
    <path d="M0 143H250" stroke="#344C6A"/>
    <circle cx="15" cy="156" r="3" fill="#4AD7E9"/>
    <text x="25" y="160" font-family="Inter,Arial,sans-serif" font-size="9" fill="#9EB4D0">Menunggu konversi</text>
  </g>
  <g transform="translate(287 68)">
    <rect width="296" height="170" rx="12" fill="#0B1423" stroke="#2F5365"/>
    <path d="M0 3Q0 0 12 0H284Q296 0 296 12V38H0Z" fill="#14283A"/>
    <path d="M0 38H296" stroke="#2F5365"/>
    <rect x="13" y="12" width="22" height="22" rx="6" fill="#17434F"/>
    <path d="M19 18h10v10H19zM22 21h4M22 24h4" fill="none" stroke="#71E5F0" stroke-width="1.3" stroke-linecap="round"/>
    <text x="45" y="21" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" letter-spacing=".8" fill="#7DABBC">OUTPUT / LUA</text>
    <text x="45" y="31" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="700" fill="#F0F6FF">Hasil Lua</text>
    <g font-family="monospace" font-size="10.5">
      <text x="15" y="62" fill="#B1C9F8">return {</text>
      <text x="27" y="82" fill="#84DFF1">Body = {</text>
      <text x="39" y="102" fill="#E4EEF9">Head = 7825...,</text>
      <text x="39" y="122" fill="#E4EEF9">Torso = 1142...,</text>
      <text x="27" y="142" fill="#84DFF1">}, ...</text>
    </g>
    <rect x="185" y="143" width="96" height="19" rx="7" fill="url(#accent)"/>
    <text x="233" y="156" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="8" font-weight="800" fill="#071321">SALIN KODE</text>
  </g>
  <path d="M272 153h12m-5-5 5 5-5 5" fill="none" stroke="#69CFE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="18" y="257" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="700" letter-spacing=".65" fill="#718AA9">BROWSER-BASED CONVERSION</text>
</g>
</svg>