<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 250" width="1200" height="250" role="img" aria-labelledby="title desc">
<title id="title">PRIVACY / REQUEST FLOW</title><desc id="desc">Illustration of browser-based conversion and Relay's safe handling of Discord requests.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset="1" stop-color="#111D31"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4C8DFF"/><stop offset="1" stop-color="#4AD7E9"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8EABD6" fill-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="250" rx="20" fill="url(#bg)"/><rect width="1200" height="250" rx="20" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="248" rx="19" fill="none" stroke="#2B405C"/>
<text x="30" y="32" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="1" fill="#80AFFF">PRIVACY / REQUEST FLOW</text><g transform="translate(28 63)"><rect width="354" height="124" rx="12" fill="#101B2C" stroke="#344A68"/><rect x="16" y="15" width="7" height="7" rx="3.5" fill="#4AD7E9"/><text x="34" y="22" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="850" letter-spacing=".4" fill="#EAF2FE">RIGFORGE CONVERTER</text><text x="16" y="52" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C3D3E8">Avatar input is parsed in the browser.</text><text x="16" y="75" font-family="Inter,Arial,sans-serif" font-size="10" fill="#91A8C6">No upload to the conversion server.</text><path d="M16 97H338" stroke="#2A3E59"/></g><path d="M388 125h20m-7-6 7 6-7 6" fill="none" stroke="#69CFE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(418 63)"><rect width="354" height="124" rx="12" fill="#101B2C" stroke="#344A68"/><rect x="16" y="15" width="7" height="7" rx="3.5" fill="#4C8DFF"/><text x="34" y="22" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="850" letter-spacing=".4" fill="#EAF2FE">RELAY CONFIGURATION</text><text x="16" y="52" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C3D3E8">Bot token and slot settings live in browser storage.</text><text x="16" y="75" font-family="Inter,Arial,sans-serif" font-size="10" fill="#91A8C6">Treat the browser as sensitive.</text><path d="M16 97H338" stroke="#2A3E59"/></g><path d="M778 125h20m-7-6 7 6-7 6" fill="none" stroke="#69CFE7" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><g transform="translate(808 63)"><rect width="354" height="124" rx="12" fill="#0F202C" stroke="#2C596B"/><rect x="16" y="15" width="7" height="7" rx="3.5" fill="#4AD7E9"/><text x="34" y="22" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="850" letter-spacing=".4" fill="#EAF2FE">DISCORD REQUEST</text><text x="16" y="52" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C3D3E8">The app API route forwards check/send requests to Discord.</text><text x="16" y="75" font-family="Inter,Arial,sans-serif" font-size="10" fill="#91A8C6">The route does not log or persist the token.</text><path d="M16 97H338" stroke="#2A3E59"/></g><text x="30" y="226" font-family="Inter,Arial,sans-serif" font-size="10" fill="#8197B4">Never commit or publicly share your Bot Token.</text>
</svg>