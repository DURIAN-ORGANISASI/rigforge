<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="1200" height="380" role="img" aria-labelledby="title desc">
<title id="title">RigForge converter workspace</title><desc id="desc">Illustrated view of the raw avatar input panel and Lua output panel.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset="1" stop-color="#111D31"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4C8DFF"/><stop offset="1" stop-color="#4AD7E9"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8EABD6" fill-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="380" rx="20" fill="url(#bg)"/><rect width="1200" height="380" rx="20" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="378" rx="19" fill="none" stroke="#2B405C"/>

  <g transform="translate(34 28)"><rect width="1132" height="42" rx="10" fill="#111E30" stroke="#2E445F"/>
  <rect x="12" y="9" width="24" height="24" rx="7" fill="url(#ac)"/><path d="M21 15 16 21l5 6M27 15l5 6-5 6" transform="translate(-1 0)" fill="none" stroke="#071321" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/>
  <text x="48" y="26" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="800" letter-spacing=".8" fill="#DCEAFB">RIGFORGE / CONVERTER WORKSPACE</text>
  <rect x="1030" y="10" width="86" height="22" rx="11" fill="#12372F" stroke="#236B59"/><circle cx="1044" cy="21" r="3" fill="#4AD7B1"/><text x="1053" y="25" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="800" fill="#A9F5DC">LOCAL</text>
  </g>
  <g transform="translate(34 88)">
  <rect width="548" height="246" rx="14" fill="#101B2C" stroke="#344A68"/><path d="M0 14Q0 0 14 0H534Q548 0 548 14V56H0Z" fill="#182941"/><path d="M0 56H548" stroke="#344A68"/>
  <text x="20" y="25" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#80AFFF">RAW AVATAR DATA</text>
  <text x="20" y="43" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#EFF6FF">PASTE YOUR DATA HERE</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13" fill="#D6E5F9">
  <text x="22" y="91">Head: 12345</text><text x="22" y="121">Torso: 23456</text><text x="22" y="151">HairAccessory: 45678, 56789</text>
  <text x="22" y="181" fill="#849BB9">Body Color: 242,215,205</text></g>
  <path d="M0 205H548" stroke="#2B405C"/><circle cx="20" cy="225" r="3" fill="#4AD7E9"/><text x="32" y="229" font-family="Inter,Arial,sans-serif" font-size="10" fill="#9DB4D2">LOCAL INPUT</text>
  </g>
  <path d="M590 208h20m-7-7 7 7-7 7" fill="none" stroke="#73D8EB" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
  <g transform="translate(618 88)">
  <rect width="548" height="246" rx="14" fill="#0B1524" stroke="#2C596B"/><path d="M0 14Q0 0 14 0H534Q548 0 548 14V56H0Z" fill="#14293A"/><path d="M0 56H548" stroke="#2C596B"/>
  <text x="20" y="25" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="800" letter-spacing="1" fill="#7CDAEA">LUA OUTPUT</text><text x="20" y="43" font-family="Inter,Arial,sans-serif" font-size="13" font-weight="750" fill="#EFF6FF">Lua table</text>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,monospace" font-size="13"><text x="22" y="89" fill="#A9C7FA">return {</text><text x="38" y="116" fill="#80DEED">  Body = {</text><text x="54" y="143" fill="#E4EEF9">    Head = 12345,</text><text x="54" y="170" fill="#E4EEF9">    Torso = 23456,</text><text x="38" y="197" fill="#80DEED">  },</text><text x="38" y="220" fill="#80DEED">  Accessories = { ... }</text></g>
  <rect x="420" y="12" width="110" height="29" rx="8" fill="url(#ac)"/><text x="475" y="30" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="10" font-weight="850" fill="#061321">COPY LUA</text>
  </g>
  <text x="36" y="360" font-family="Inter,Arial,sans-serif" font-size="10" fill="#758AA7">Illustrative interface — values are examples</text>
</svg>