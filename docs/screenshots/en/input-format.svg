<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" width="1200" height="350" role="img" aria-labelledby="title desc">
<title id="title">RigForge input format examples</title><desc id="desc">Text token examples and supported avatar data groups.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#080D18"/><stop offset="1" stop-color="#111D31"/></linearGradient>
<linearGradient id="ac" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#4C8DFF"/><stop offset="1" stop-color="#4AD7E9"/></linearGradient>
<pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#8EABD6" fill-opacity=".12"/></pattern>
</defs>
<rect width="1200" height="350" rx="20" fill="url(#bg)"/><rect width="1200" height="350" rx="20" fill="url(#dots)"/>
<rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#2B405C"/>
<text x="32" y="32" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="850" letter-spacing="1" fill="#80AFFF">INPUT FORMAT / EXAMPLES</text>
  <g transform="translate(32 54)"><rect width="525" height="266" rx="13" fill="#101B2C" stroke="#344A68"/><path d="M0 12Q0 0 12 0H513Q525 0 525 12V45H0Z" fill="#182941"/><path d="M0 45H525" stroke="#344A68"/><text x="22" y="28" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#EFF6FF">PLAIN TEXT TOKENS</text><text x="24" y="94" font-family="ui-monospace,monospace" font-size="13" fill="#DFEAF9">Head: 12345</text><text x="24" y="125" font-family="ui-monospace,monospace" font-size="13" fill="#DFEAF9">Torso: 23456</text><text x="24" y="156" font-family="ui-monospace,monospace" font-size="13" fill="#DFEAF9">Pants: 34567</text><text x="24" y="187" font-family="ui-monospace,monospace" font-size="13" fill="#DFEAF9">HairAccessory: 45678, 56789</text><text x="24" y="218" font-family="ui-monospace,monospace" font-size="13" fill="#83DFEE">Body Color: 242,215,205 (#F2D7CD)</text></g>
  <g transform="translate(620 58)"><text x="0" y="21" font-family="Inter,Arial,sans-serif" font-size="11" font-weight="800" fill="#EFF6FF">SUPPORTED GROUPS</text><g transform="translate(0 35)"><g transform="translate(0 0)"><rect x="0" y="0" width="440" height="42" rx="8" fill="#121F32" stroke="#2B405B"/><text x="14" y="16" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850" letter-spacing=".5" fill="#80AFFF">BODY PARTS</text><text x="14" y="32" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C6D6EC">Head · Torso · Arms · Legs</text></g><g transform="translate(0 53)"><rect x="0" y="0" width="440" height="42" rx="8" fill="#121F32" stroke="#2B405B"/><text x="14" y="16" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850" letter-spacing=".5" fill="#80AFFF">CLASSIC CLOTHING</text><text x="14" y="32" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C6D6EC">Shirt · Pants · TShirt</text></g><g transform="translate(0 106)"><rect x="0" y="0" width="440" height="42" rx="8" fill="#121F32" stroke="#2B405B"/><text x="14" y="16" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850" letter-spacing=".5" fill="#80AFFF">ACCESSORIES</text><text x="14" y="32" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C6D6EC">Hair · Face · Neck · Back · Waist</text></g><g transform="translate(0 159)"><rect x="0" y="0" width="440" height="42" rx="8" fill="#121F32" stroke="#2B405B"/><text x="14" y="16" font-family="Inter,Arial,sans-serif" font-size="9" font-weight="850" letter-spacing=".5" fill="#80AFFF">JSON BLOB</text><text x="14" y="32" font-family="Inter,Arial,sans-serif" font-size="11" fill="#C6D6EC">AccessoryBlob Data: + JSON array</text></g></g></g>
</svg>